---
layout: default
---
<article class="article">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← Back to all posts</a>
  <header class="article-header"><p class="eyebrow">{{ page.date | date: "%B %d, %Y" }}</p><h1>{{ page.title }}</h1>{% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}<div class="tag-list">{% for tag in page.tags %}<a class="tag" href="{{ '/blog/' | relative_url }}#{{ tag | slugify }}">{{ tag }}</a>{% endfor %}</div></header>
  <div class="prose">{{ content }}</div>
</article>
